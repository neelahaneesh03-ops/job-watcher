# Job watcher settings. Edit this file on GitHub to change what you get emailed.

[roles]
# Kept if the TITLE matches include_regex and does NOT match exclude_regex (case-insensitive).
include_regex = '''\b(machine learning|ml|ai\s*/\s*ml|ai\s+(engineer|engineering|research|researcher|scientist|developer|software|platform|infrastructure|systems?|applications?)|(applied|generative|gen|conversational|physical)\s+ai|artificial intelligence engineer|deep learning|computer vision|vision|perception|robotics?|autonomy|software engineer(ing|s)?|software developers?|swe|backend|back[- ]end|full[- ]?stack|founding engineers?|member of technical staff|applied scientists?|research engineers?|ml ?ops|inference|llm|data scientists?|platform engineers?|new grad|university grad)\b'''
# Senior-level titles are dropped because you want roles needing under 3 years.
exclude_regex = '''((?<!technical )\bstaff\b|\bprincipal\b|\bdirector\b|\bmanager\b|\bhead of\b|\bvp\b|vice president|\bdistinguished\b|\bintern(ship)?\b|\bco-?op\b|\bsales\b|\bmarketing\b|\brecruit|\baccount executive\b|\bsolutions? engineer\b|\bsupport\b|\bsenior\b|\bsr\.?\b|\blead\b|\barchitect\b|\b(iii|iv|v|vi)\b|\b(engineer|developer|scientist|swe|sde)\s*,?\s*[3-9]\b|\blevel\s*[3-9]\b|\bL[5-9]\b|\bfellow\b|part[- ]time|\btrainee\b|apprentice|\bcontract(or)?\b|freelance|\bdesigner\b)'''

[experience]
# Reads each new job's description. Drops it if the SMALLEST "N+ years" it asks for is above this.
# 2 = junior roles only (0-2 years). Set to 3 to also get "3+ years" roles.
max_required_years = 2
# Also drop if the posting mentions this many years ANYWHERE (catches "at least 9 years" + "3+ years of AWS").
hard_cap_years = 6
# If no years are stated, drop jobs with 2+ senior phrases ("experienced engineer", "help lead", "you've led"...).
max_senior_signals = 1
# Drop jobs that require a PhD ("PhD preferred" or "PhD or MS" are kept).
drop_phd_required = true

[sponsorship]
# Drop jobs whose description rules out visa sponsorship / requires citizenship or clearance.
drop_no_sponsorship = true

[location]
allow_non_us = false

[sources]
simplify_new_grad = true      # SimplifyJobs New-Grad-Positions (curated new-grad list, big tech included)
job_board_directory = true    # ~12k company boards on Greenhouse / Ashby / Lever / Workday
yc = true                     # every hiring YC company (finds their job board automatically)
workday_every_n_runs = 3      # Workday is slow; each run checks 1/3 of Workday boards (each board every 3 hours)
workday_queries = ["software engineer", "machine learning"]
custom_sites = true           # Amazon, Microsoft, Google, Apple, Meta career sites
custom_queries = ["machine learning", "software engineer", "computer vision", "new grad"]
hn_whos_hiring = true         # monthly "Ask HN: Who is hiring?" thread (many small/new startups)
discover_more = true          # find job boards for companies in companies.csv + the Simplify list
discovery_per_run = 400       # companies to look up per run (results are remembered)
discovery_seconds = 150       # max time per run spent looking up new companies
rediscover_days = 14


[yc]
regions = ["United States of America", "America / Canada", "Remote", "Fully Remote"]
rediscover_days = 7
check_yc_page_for_unknown = true

[news]
# Added to the daily morning email.
funding_news = true           # startups that just raised money (TechCrunch + Crunchbase News)
new_yc_companies = true       # newest YC batch companies in your areas
max_items = 10
interest_regex = '''\b(ai|artificial intelligence|machine learning|robot\w*|computer vision|vision|autonomous|drone\w*|biotech|drug|pharma|therapeutic\w*|protein|genomic\w*|health\w*|medical|hardware|chip\w*|semiconductor|llm|agent\w*|defense tech|physical ai)\b'''

[gems]
interest_tags = ["AI", "Machine Learning", "Generative AI", "Computer Vision", "Robotics",
                 "Hard Tech", "Biotech", "Drug Discovery", "Healthcare", "Health Tech",
                 "Autonomous Vehicles", "Drones", "Hardware", "Infrastructure", "Developer Tools"]
small_team = 40
recent_batch_year = 2024
min_score = 3

[notify]
send_when_empty = false
max_jobs_per_email = 100
