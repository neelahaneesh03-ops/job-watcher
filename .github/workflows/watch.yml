name: job-watcher

on:
  schedule:
    - cron: "7 * * * *"   # every hour at :07 (UTC). Private repo? use "7 */2 * * *" to stay in free minutes.
  workflow_dispatch:       # lets you click "Run workflow" to test

permissions:
  contents: write          # to save state/seen.json back to the repo

concurrency:
  group: job-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests beautifulsoup4

      - name: Check for new jobs
        run: python watcher.py
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      - name: Save state
        if: always()
        run: |
          git config user.name "job-watcher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state
          git diff --cached --quiet || git commit -m "Update seen jobs" -q
          git pull --rebase -q || true
          git push -q
