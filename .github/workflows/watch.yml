name: job-watcher

on:
  workflow_dispatch:        # lets you click "Run workflow" to test
    inputs:
      mode:
        description: "watch = new jobs, digest = today's top 25"
        type: choice
        options: [watch, digest]
        default: watch

permissions:
  contents: read

concurrency:
  group: job-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests beautifulsoup4

      # Remembers which jobs were already seen between runs.
      - uses: actions/cache/restore@v4
        with:
          path: state
          key: watcher-state-${{ github.run_id }}
          restore-keys: watcher-state-

      - name: Check for new jobs
        run: python watcher.py
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          MODE: ${{ github.event.schedule == '23 13 * * *' && 'digest' || inputs.mode || 'watch' }}
          DIGEST_SIZE: "25"

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state
          key: watcher-state-${{ github.run_id }}

      # Download from the run's Summary page: all currently open matching jobs as CSV.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: open-jobs
          path: out/
          retention-days: 3
